<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timestamp Cutter</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>Timestamp Cutter</h1>
        </header>

        <section class="section">
            <label class="section-label" for="seq-select">Select Sequence</label>
            <div class="sequence-row">
                <select id="seq-select">
                    <option value="">Loading...</option>
                </select>
                <button type="button" id="btn-refresh" class="btn-secondary">Refresh</button>
            </div>
        </section>

        <section class="section">
            <div class="section-label">Time Ranges</div>
            <div id="ranges-container"></div>
            <button type="button" id="btn-add-range" class="btn-secondary btn-full">+ Add Range</button>
        </section>

        <section class="section option-section">
            <label class="checkbox-row">
                <input type="checkbox" id="keep-only-ranges" />
                <span>Keep only selected ranges</span>
            </label>
            <div class="option-help">Deletes everything outside the selected time ranges.</div>
        </section>

        <button type="button" id="btn-apply" class="btn-primary">Apply Cuts</button>

        <section class="section">
            <div class="log-header">
                <div class="section-label">Log</div>
                <button type="button" id="btn-clear-log" class="btn-link">Clear</button>
            </div>
            <div id="log" aria-live="polite">
                <span class="log-empty">Waiting...</span>
            </div>
        </section>
    </div>

    <script src="CSInterface.js"></script>
    <script src="main.js"></script>
</body>
</html>
